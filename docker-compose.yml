services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: issuelens
      POSTGRES_PASSWORD: issuelens
      POSTGRES_DB: issuelens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuelens -d issuelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  migrate:
    build: ./backend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      ISSUELENS_DATABASE_URL: postgresql+asyncpg://issuelens:issuelens@postgres:5432/issuelens
    volumes:
      # Mount live sources: baked-in copies go stale between image rebuilds,
      # which is how the dev DB got stuck behind schema updates (#41)
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ISSUELENS_DATABASE_URL: postgresql+asyncpg://issuelens:issuelens@postgres:5432/issuelens
      ISSUELENS_REDIS_URL: redis://redis:6379/0
      # Forwarded from repo-root .env (compose does not inject .env into containers by itself)
      ISSUELENS_GITHUB_APP_ID: ${ISSUELENS_GITHUB_APP_ID:-}
      ISSUELENS_GITHUB_APP_PRIVATE_KEY_B64: ${ISSUELENS_GITHUB_APP_PRIVATE_KEY_B64:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    command: ["uv", "run", "arq", "worker.WorkerSettings"]
    environment:
      ISSUELENS_DATABASE_URL: postgresql+asyncpg://issuelens:issuelens@postgres:5432/issuelens
      ISSUELENS_REDIS_URL: redis://redis:6379/0
      ISSUELENS_OLLAMA_URL: http://ollama:11434
      # Forwarded from repo-root .env (compose does not inject .env into containers by itself)
      ISSUELENS_GITHUB_APP_ID: ${ISSUELENS_GITHUB_APP_ID:-}
      ISSUELENS_GITHUB_APP_PRIVATE_KEY_B64: ${ISSUELENS_GITHUB_APP_PRIVATE_KEY_B64:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker.py:/app/worker.py
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  ollamadata:
